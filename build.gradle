plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '8.9.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def optionalDependencyCatalog = [
        codechickenlib   : [notation: "maven.modrinth:codechicken-lib:${codechicken_lib_version}"],
        brandonscore     : [notation: "maven.modrinth:brandons-core:${brandons_core_version}"],
        draconic         : [
                notation       : "maven.modrinth:draconic-evolution:${draconic_evolution_version}",
                modId          : 'draconicevolution',
                metadataVersion: draconic_evolution_version
        ],
        mekanism         : [
                notation       : "maven.modrinth:mekanism:${mekanism_version}",
                modId          : 'mekanism',
                metadataVersion: mekanism_metadata_version
        ],
        voltaic          : [
                notation       : "curse.maven:voltaic-1237904:${voltaic_curse_file}",
                modId          : 'voltaic',
                metadataVersion: voltaic_version
        ],
        electrodynamics  : [
                notation       : "curse.maven:electrodynamics-316867:${electrodynamics_curse_file}",
                modId          : 'electrodynamics',
                metadataVersion: electrodynamics_version
        ],
        nuclearscience   : [
                notation       : "curse.maven:nuclear-science-318646:${nuclear_science_curse_file}",
                modId          : 'nuclearscience',
                metadataVersion: nuclear_science_version
        ],
        ballistix        : [
                notation       : "curse.maven:ballistix-443915:${ballistix_curse_file}",
                modId          : 'ballistix',
                metadataVersion: ballistix_version
        ],
        pneumaticcraft  : [
                notation       : "curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_curse_file}",
                modId          : 'pneumaticcraft',
                metadataVersion: pneumaticcraft_version
        ],
        moretnt          : [
                notation       : "curse.maven:more-fun-tnts-895335:${more_fun_tnts_curse_file}",
                modId          : 'moretnt',
                metadataVersion: more_fun_tnts_version
        ],
        simulated        : [
                notation       : "dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${create_aeronautics_version}",
                modId          : 'simulated',
                metadataVersion: create_aeronautics_version
        ],
        aeronautics      : [
                notation       : "dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${create_aeronautics_version}",
                modId          : 'aeronautics',
                metadataVersion: create_aeronautics_version
        ],
        offroad          : [
                notation       : "dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${create_aeronautics_version}",
                modId          : 'offroad',
                metadataVersion: create_aeronautics_version
        ]
]

def integrations = [
        draconic      : [
                dependencyKeys: ['codechickenlib', 'brandonscore', 'draconic'],
                mixinConfig: "${mod_id}.draconic.mixins.json"
        ],
        mekanism      : [
                dependencyKeys: ['mekanism'],
                mixinConfig: "${mod_id}.mekanism.mixins.json"
        ],
        ballistix     : [
                dependencyKeys: ['voltaic', 'ballistix'],
                mixinConfig: "${mod_id}.ballistix.mixins.json"
        ],
        nuclearscience: [
                dependencyKeys: ['voltaic', 'electrodynamics', 'nuclearscience'],
                mixinConfig: "${mod_id}.nuclearscience.mixins.json"
        ],
        pneumaticcraft: [
                dependencyKeys: ['pneumaticcraft'],
                mixinConfig: "${mod_id}.pneumaticcraft.mixins.json"
        ],
        moretnt       : [
                dependencyKeys: ['moretnt'],
                mixinConfig: "${mod_id}.moretnt.mixins.json"
        ]
]

def aviationRuntimes = ['simulated', 'aeronautics', 'offroad'] as Set

def supportedCompatRuntimes = (integrations.keySet() + aviationRuntimes) as Set
def compatRuntimeSelection = providers.gradleProperty('compat_runtime').getOrElse('full')
def enabledCompatRuntimes
if (compatRuntimeSelection == 'full') {
    enabledCompatRuntimes = supportedCompatRuntimes
} else if (compatRuntimeSelection == 'minimal') {
    enabledCompatRuntimes = [] as Set
} else {
    enabledCompatRuntimes = compatRuntimeSelection.split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() } as Set
    def unsupportedCompatRuntimes = enabledCompatRuntimes - supportedCompatRuntimes
    if (!unsupportedCompatRuntimes.isEmpty()) {
        throw new GradleException("Unsupported compat_runtime entries: ${unsupportedCompatRuntimes.sort()}")
    }
}

def compatExclusions = providers.gradleProperty('compat_exclude').getOrElse('')
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() } as Set
def unsupportedCompatExclusions = compatExclusions - supportedCompatRuntimes
if (!unsupportedCompatExclusions.isEmpty()) {
    throw new GradleException("Unsupported compat_exclude entries: ${unsupportedCompatExclusions.sort()}")
}
enabledCompatRuntimes = enabledCompatRuntimes - compatExclusions
def gameTestRuntimeId = enabledCompatRuntimes.toList().sort().join('-') ?: 'minimal'
def gameTestRunId = providers.gradleProperty('game_test_run_id').getOrElse('default')
if (!(gameTestRunId ==~ /[A-Za-z0-9._-]+/)) {
    throw new GradleException('game_test_run_id may contain only letters, digits, dots, underscores, and hyphens')
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gameTestResources')
def generateGameTestStructures = tasks.register('generateGameTestStructures') {
    def encodedStructure = layout.projectDirectory.file('src/gametest/templates/bootstrap.nbt.base64')
    def generatedStructure = generatedGameTestResources.map {
        it.file('data/letemburn/structure/bootstrap.nbt')
    }
    inputs.file(encodedStructure)
    outputs.file(generatedStructure)
    doLast {
        def outputFile = generatedStructure.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.bytes = Base64.decoder.decode(encodedStructure.asFile.text.trim())
    }
}

sourceSets {
    integrations.each { name, ignored ->
        create(name) {
            java.srcDir "src/integration/${name}/java"
            resources.srcDir "src/integration/${name}/resources"
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    main {
        integrations.each { name, ignored ->
            runtimeClasspath += sourceSets[name].output
        }
    }

    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        integrations.each { name, ignored ->
            compileClasspath += sourceSets[name].output
            runtimeClasspath += sourceSets[name].output
        }
    }

    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        resources.srcDir generatedGameTestResources
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        integrations.each { name, ignored ->
            compileClasspath += sourceSets[name].output
            runtimeClasspath += sourceSets[name].output
        }
    }
}

tasks.withType(Jar).configureEach {
    exclude '.cache'
}

tasks.named('jar', Jar).configure {
    integrations.each { name, ignored ->
        from sourceSets[name].output
    }
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    integrations.each { name, ignored ->
        from sourceSets[name].allSource
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--mixin.config', "${mod_id}.gametest.mixins.json"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.projectDirectory.dir("run/gametest/${gameTestRuntimeId}/${gameTestRunId}")
            programArguments.addAll '--mixin.config', "${mod_id}.gametest.mixins.json"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'create'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            integrations.each { name, ignored ->
                sourceSet(sourceSets[name])
            }
            sourceSet(sourceSets.gameTest)
        }
    }
}

configurations {
    localImplementation
    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localRuntime
}

integrations.each { name, ignored ->
    def integrationDependencies = configurations.create("${name}LocalImplementation") {
        canBeConsumed = false
        canBeResolved = false
    }
    configurations.named("${name}CompileClasspath") {
        extendsFrom integrationDependencies
    }
    configurations.named("${name}RuntimeClasspath") {
        extendsFrom integrationDependencies
    }
    configurations.named('testCompileClasspath') {
        extendsFrom integrationDependencies
    }
    configurations.named('testRuntimeClasspath') {
        extendsFrom integrationDependencies
    }
    configurations.named('gameTestCompileClasspath') {
        extendsFrom integrationDependencies
    }
    if (enabledCompatRuntimes.contains(name)) {
        configurations.named('runtimeClasspath') {
            extendsFrom integrationDependencies
        }
    }
}

aviationRuntimes.each { name ->
    def optionalRuntime = configurations.create("${name}LocalRuntime") {
        canBeConsumed = false
        canBeResolved = false
    }
    if (enabledCompatRuntimes.contains(name)
            || (name == 'simulated' && enabledCompatRuntimes.intersect(['aeronautics', 'offroad']))) {
        configurations.named('runtimeClasspath') {
            extendsFrom optionalRuntime
        }
    }
}

repositories {
    maven { url = uri('https://maven.createmod.net') } // Ponder, Flywheel
    maven { url = uri('https://mvn.devos.one/snapshots') } // Registrate
    maven { url = uri('https://maven.blamejared.com') } // JEI
    maven { url = uri('https://maven.theillusivec4.top/') } // Curios API
    maven { url = uri('https://maven.fallenbreath.me/releases') } // Conditional Mixin
    maven { url = uri('https://www.cursemaven.com') }
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://raw.githubusercontent.com/Fuzss/modresources/main/maven') } // NeoForge config API port, needed by Ponder
    maven { url = uri('https://maven.ryanhcode.dev/releases') } // RyanHCode Maven - Sable
}

dependencies {
    jarJar(implementation('me.fallenbreath:conditional-mixin-neoforge')) {
        version {
            strictly "[${conditional_mixin_version},)"
            prefer conditional_mixin_version
        }
    }

    compileOnlyApi("dev.engine-room.flywheel:flywheel-neoforge-api-${flywheel_minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${flywheel_minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${flywheel_minecraft_version}:${vanillin_version}")
    api("com.tterrag.registrate:Registrate:${registrate_version}")
    api("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    api("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }

    compileOnly("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}")

    localImplementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")

    aviationRuntimes.each { name ->
        add("${name}LocalRuntime", optionalDependencyCatalog[name].notation) { transitive = false }
    }

    integrations.each { name, integration ->
        integration.dependencyKeys.each { dependencyKey ->
            add("${name}LocalImplementation", optionalDependencyCatalog[dependencyKey].notation)
        }
    }

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

def integrationMixinBlocks = integrations.values()
        .collect { integration -> "[[mixins]]\nconfig=\"${integration.mixinConfig}\"" }
        .join('\n\n')
def optionalDependencyBlocks = optionalDependencyCatalog.values()
        .findAll { dependency -> dependency.modId && dependency.metadataVersion }
        .unique { dependency -> dependency.modId }
        .collect { dependency ->
            [
                    "[[dependencies.\"${mod_id}\"]]",
                    "    modId=\"${dependency.modId}\"",
                    '    type="optional"',
                    "    versionRange=\"[${dependency.metadataVersion},)\"",
                    '    ordering="AFTER"',
                    '    side="BOTH"'
            ].join('\n')
        }
        .join('\n\n')

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            mod_github                 : mod_github,
            sable_version              : sable_version,
            create_version_production  : create_version_production,
            integration_mixin_blocks   : integrationMixinBlocks,
            optional_dependency_blocks : optionalDependencyBlocks
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generateModMetadata
}

neoForge.ideSyncTask generateModMetadata

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile 'codeformat/formatter-config.xml'
        licenseHeaderFile 'codeformat/HEADER.txt'
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('spotlessCheck')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('benchmarkDraconicAnnuli', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic Draconic explosion annulus microbenchmark.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.marblegate.letemburn.integration.draconic.DraconicAnnulusBenchmark'
}

tasks.named('processGameTestResources').configure {
    dependsOn generateGameTestStructures
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
