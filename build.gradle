plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '8.9.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gameTestResources')
def generateGameTestStructures = tasks.register('generateGameTestStructures') {
    def encodedStructure = layout.projectDirectory.file('src/gametest/templates/bootstrap.nbt.base64')
    def generatedStructure = generatedGameTestResources.map {
        it.file('data/letemburn/structure/bootstrap.nbt')
    }
    inputs.file(encodedStructure)
    outputs.file(generatedStructure)
    doLast {
        def outputFile = generatedStructure.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.bytes = Base64.decoder.decode(encodedStructure.asFile.text.trim())
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }

    gameTest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        resources.srcDir generatedGameTestResources
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

tasks.withType(Jar).configureEach {
    exclude ".cache"
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources/').getAbsolutePath(),
                                    '--existing', file('src/main/resources/').getAbsolutePath(),
                                    '--existing-mod', 'create'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

configurations {
    localImplementation
    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localRuntime
}

def supportedCompatRuntimes = ['ballistix', 'draconic', 'mekanism', 'moretnt', 'pneumaticcraft'] as Set
def compatRuntimeSelection = providers.gradleProperty('compat_runtime').getOrElse('full')
def enabledCompatRuntimes
if (compatRuntimeSelection == 'full') {
    enabledCompatRuntimes = supportedCompatRuntimes
} else if (compatRuntimeSelection == 'minimal') {
    enabledCompatRuntimes = [] as Set
} else {
    enabledCompatRuntimes = compatRuntimeSelection.split(',').collect { it.trim() }.findAll { !it.isEmpty() } as Set
    def unsupportedCompatRuntimes = enabledCompatRuntimes - supportedCompatRuntimes
    if (!unsupportedCompatRuntimes.isEmpty()) {
        throw new GradleException("Unsupported compat_runtime entries: ${unsupportedCompatRuntimes.sort()}")
    }
}

repositories {
    maven { url = uri('https://maven.createmod.net') } // Ponder, Flywheel
    maven { url = uri('https://mvn.devos.one/snapshots') } // Registrate
    maven { url = uri('https://maven.blamejared.com') } // JEI
    maven { url = uri('https://maven.theillusivec4.top/') } // Curios API
    maven { url = uri('https://maven.fallenbreath.me/releases') } // Conditional Mixin
    maven { url = uri('https://www.cursemaven.com') }
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://raw.githubusercontent.com/Fuzss/modresources/main/maven') } // NeoForge config api port, needed by ponder
    maven { url = uri('https://maven.ryanhcode.dev/releases') } // RyanHCode Maven - Sable
}

dependencies {
    jarJar(implementation("me.fallenbreath:conditional-mixin-neoforge")) {
        version {
            strictly "[${conditional_mixin_version},)"
            prefer conditional_mixin_version
        }
    }

    compileOnlyApi("dev.engine-room.flywheel:flywheel-neoforge-api-${flywheel_minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${flywheel_minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${flywheel_minecraft_version}:${vanillin_version}")
    api("com.tterrag.registrate:Registrate:${registrate_version}")
    api("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    api("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }

    compileOnly("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}")

    localImplementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    localImplementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${create_aeronautics_version}") { transitive = false }
    localImplementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${create_aeronautics_version}") { transitive = false }
    localImplementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${create_aeronautics_version}") { transitive = false }

    compileOnly("maven.modrinth:codechicken-lib:${codechicken_lib_version}")
    compileOnly("maven.modrinth:brandons-core:${brandons_core_version}")
    compileOnly("maven.modrinth:draconic-evolution:${draconic_evolution_version}")
    if (enabledCompatRuntimes.contains('draconic')) {
        localRuntime("maven.modrinth:codechicken-lib:${codechicken_lib_version}")
        localRuntime("maven.modrinth:brandons-core:${brandons_core_version}")
        localRuntime("maven.modrinth:draconic-evolution:${draconic_evolution_version}")
    }

    compileOnly("maven.modrinth:mekanism:${mekanism_version}")
    if (enabledCompatRuntimes.contains('mekanism')) {
        localRuntime("maven.modrinth:mekanism:${mekanism_version}")
    }

    compileOnly("curse.maven:voltaic-1237904:${voltaic_curse_file}")
    compileOnly("curse.maven:electrodynamics-316867:${electrodynamics_curse_file}")
    compileOnly("curse.maven:nuclear-science-318646:${nuclear_science_curse_file}")
    compileOnly("curse.maven:ballistix-443915:${ballistix_curse_file}")
    if (enabledCompatRuntimes.contains('ballistix')) {
        localRuntime("curse.maven:voltaic-1237904:${voltaic_curse_file}")
        localRuntime("curse.maven:electrodynamics-316867:${electrodynamics_curse_file}")
        localRuntime("curse.maven:nuclear-science-318646:${nuclear_science_curse_file}")
        localRuntime("curse.maven:ballistix-443915:${ballistix_curse_file}")
    }

    compileOnly("curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_curse_file}")
    if (enabledCompatRuntimes.contains('pneumaticcraft')) {
        localRuntime("curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_curse_file}")
    }

    compileOnly("curse.maven:more-fun-tnts-895335:${more_fun_tnts_curse_file}")
    if (enabledCompatRuntimes.contains('moretnt')) {
        localRuntime("curse.maven:more-fun-tnts-895335:${more_fun_tnts_curse_file}")
    }

    localRuntime("maven.modrinth:createaddition:${createaddition_version}") // Creative Generator for fast test

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_github             : mod_github,
            sable_version          : sable_version,
            ballistix_version       : ballistix_version,
            nuclear_science_version: nuclear_science_version,
            electrodynamics_version: electrodynamics_version,
            voltaic_version         : voltaic_version,
            pneumaticcraft_version  : pneumaticcraft_version,
            more_fun_tnts_version   : more_fun_tnts_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generateModMetadata
}

neoForge.ideSyncTask generateModMetadata

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile "codeformat/formatter-config.xml"
        licenseHeaderFile "codeformat/HEADER.txt"
    }
}

build.dependsOn(spotlessApply)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('benchmarkDraconicAnnuli', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic Draconic explosion annulus microbenchmark.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.marblegate.letemburn.compat.draconic.DraconicAnnulusBenchmark'
}

tasks.named('processGameTestResources').configure {
    dependsOn generateGameTestStructures
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
